name: Uptime ProMilitar

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: uptime-promilitar
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Comprobar web y app
        id: check
        shell: bash
        run: |
          failed=""
          for target in "web|https://promilitar.es/" "app|https://app.promilitar.es/"; do
            name="${target%%|*}"
            url="${target#*|}"
            ok=0
            for attempt in 1 2; do
              code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 15 "$url" || echo 000)
              if [ "$code" -ge 200 ] && [ "$code" -lt 400 ]; then ok=1; break; fi
              sleep 10
            done
            [ "$ok" -eq 1 ] || failed="$failed $name($url)"
          done
          echo "failed=$failed" >> "$GITHUB_OUTPUT"

      - name: Gestionar incidencia
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILED: ${{ steps.check.outputs.failed }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          abierto=$(gh issue list --state open --search 'ProMilitar caído in:title' --json number --jq '.[0].number // empty')
          avisar() {
            if [ -n "${TELEGRAM_TOKEN:-}" ] && [ -n "${TELEGRAM_CHAT_ID:-}" ]; then
              curl -s --max-time 15 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
                --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
                --data-urlencode "text=$1" >/dev/null || true
            fi
          }
          if [ -n "$FAILED" ]; then
            if [ -z "$abierto" ]; then
              gh issue create --title "🔴 ProMilitar caído" --assignee "$GITHUB_REPOSITORY_OWNER" \
                --body "No responden:$FAILED

Detectado: $(date -u '+%Y-%m-%d %H:%M UTC')" >/dev/null
              avisar "🔴 ProMilitar CAÍDO:$FAILED"
              exit 1
            fi
            echo "Incidencia ya abierta (#$abierto); no se duplica."
          else
            if [ -n "$abierto" ]; then
              gh issue close "$abierto" --comment "Recuperado $(date -u '+%Y-%m-%d %H:%M UTC')" >/dev/null
              avisar "🟢 ProMilitar recuperado"
            fi
          fi

      - name: Keepalive mensual
        if: github.event_name == 'schedule'
        shell: bash
        run: |
          if [ "$(date -u +%d)" != "01" ]; then exit 0; fi
          date -u > .github/keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive.txt
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
